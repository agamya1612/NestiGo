version: '3.8'

services:
  # Postgres Database (Replacing Supabase local due to architecture issues)
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: nestigo-postgres
    environment:
      POSTGRES_USER: nestigo_user
      POSTGRES_PASSWORD: nestigo_password
      POSTGRES_DB: nestigo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis for Caching and Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: nestigo-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: nestigo-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: nestigo-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  # Kafka UI for debugging messages
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nestigo-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: nestigo-frontend
    ports:
      - "8081:8080" # Using 8081 since kafka-ui is using 8080
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_GATEWAY_URL=http://api-gateway:3000
      - NEXT_PUBLIC_WEBSOCKET_SERVICE_URL=ws://websocket-service:3005
      - NEXT_PUBLIC_CHAT_SERVICE_URL=ws://chat-service:3009
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    networks:
      - nestigo-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  nestigo-net:
    driver: bridge
